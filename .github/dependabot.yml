version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # proj-sys >= 0.26 needs PROJ >= 9.6.2; the Docker base (Debian trixie)
      # has 9.6.0. Lift this when the base image's PROJ catches up.
      - dependency-name: proj
        versions: [">= 0.29"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
